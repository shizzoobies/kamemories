name = "wedding-photos"
main = "src/index.js"
account_id = "c8f0f7697e2801ba2acabb700b5da793"
compatibility_date = "2025-01-01"

# Custom domain for the guest QR link. tandcknot.com is registered in this Cloudflare
# account (Cloudflare Registrar), so the DNS record and TLS certificate are provisioned
# on deploy. For a subdomain instead, set pattern = "photos.tandcknot.com".
[[routes]]
pattern = "tandcknot.com"
custom_domain = true

# Capture app lives on its own subdomain. Same Worker, the root serves capture.html.
[[routes]]
pattern = "pics.tandcknot.com"
custom_domain = true

# Static guest and gallery pages live in ./public and are served automatically.
# The Worker only runs for /api/* and /media/* (anything with no matching file).
[assets]
directory = "./public"
binding = "ASSETS"
# Run the Worker before assets for the root only, so each host gets the right home page:
# pics.tandcknot.com serves the capture app, the apex serves the landing.
run_worker_first = ["/"]

[vars]
EVENT_NAME = "Tristin & Cory"
DAILY_LIMIT = "10"
# Hostname that serves the guest capture app (its root shows the camera, not the landing).
CAPTURE_HOST = "pics.tandcknot.com"
# ALBUM_KEY is a secret. Do not put it here. Set it with:
#   npx wrangler secret put ALBUM_KEY
# The couple opens the album at /gallery.html?k=THAT_KEY

# D1 database. Create it once, then paste the id below.
#   npx wrangler d1 create wedding-photos
[[d1_databases]]
binding = "DB"
database_name = "wedding-photos"
database_id = "12ffa9a7-0eb0-482b-8a65-f61fd4dd9037"

# R2 bucket for the actual photo and video files.
#   npx wrangler r2 bucket create wedding-photos
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "wedding-photos"
