name = "kamemories"
main = "src/index.js"
account_id = "c8f0f7697e2801ba2acabb700b5da793"
compatibility_date = "2025-01-01"

# One Worker serves every host. With run_worker_first the Worker runs for all
# requests and decides what to serve based on the hostname:
#   kamemories.com / www.kamemories.com  -> control plane (marketing, login, dashboard)
#   {slug}.kamemories.com                -> one event (landing, gallery, guest capture)
# Static files in ./public are served by the Worker via the ASSETS binding.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
# Serve exact asset paths only. The Worker maps clean URLs (/, /login, /app,
# /gallery, /add) to their .html files; without this, an asset fetch for a
# .html file 307-redirects to its extensionless form.
html_handling = "none"

# Apex (control plane). kamemories.com must be added to this Cloudflare account
# as a zone (Cloudflare Registrar or an existing zone) for these routes to bind.
[[routes]]
pattern = "kamemories.com/*"
zone_name = "kamemories.com"

# Every subdomain is an event, served by the same Worker. Requires a proxied
# wildcard DNS record (*.kamemories.com) in the zone. www and other reserved
# labels (see RESERVED_SUBDOMAINS) are handled as the control plane in code.
[[routes]]
pattern = "*.kamemories.com/*"
zone_name = "kamemories.com"

[vars]
# Root domain. Anything that is not this host (or www.) and ends in .ROOT_HOST is
# treated as an event subdomain whose label is the event slug.
ROOT_HOST = "kamemories.com"
# Subdomain labels that are never treated as event slugs (comma separated).
RESERVED_SUBDOMAINS = "www,app,api,mail,static,assets,cdn,admin,pics,help,support,blog,status,dev"
# From address for magic-link login email.
MAIL_FROM = "KA Memories <login@kamemories.com>"
# Secrets (set with `npx wrangler secret put NAME`):
#   RESEND_API_KEY        transactional email. Without it, login runs in dev mode
#                         and returns the magic link in the API response instead of
#                         sending it. Never run production without this set.
#   STRIPE_SECRET_KEY     billing, added in a later pass.
#   STRIPE_WEBHOOK_SECRET billing, added in a later pass.

# D1 database. Create it once, then paste the printed id below.
#   npx wrangler d1 create kamemories
[[d1_databases]]
binding = "DB"
database_name = "kamemories"
database_id = "REPLACE_WITH_KAMEMORIES_D1_ID"

# R2 bucket for the actual photo files.
#   npx wrangler r2 bucket create kamemories
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "kamemories"
