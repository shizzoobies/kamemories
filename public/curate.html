<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a1626" />
<title>Curation &middot; Tristin &amp; Cory</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Tristin <span>&amp;</span> Cory</a>
  <nav>
    <a href="/gallery">Gallery</a>
  </nav>
</header>

<div class="key-gate" id="gate" style="display:none">
  <h1 class="display" style="font-weight:500;font-size:2rem;margin:0">Curation</h1>
  <p style="color:var(--muted);margin-top:10px">Enter the owner key to review and approve photos.</p>
  <input id="keyInput" type="password" placeholder="Owner key" autocomplete="current-password" />
  <div class="row" style="margin-top:14px">
    <button id="keyBtn" class="btn primary" type="button">Open the console</button>
  </div>
  <p id="gateErr" style="color:var(--danger);font-size:0.86rem;min-height:1.2em"></p>
</div>

<div id="console" style="display:none">
  <div class="gallery-head">
    <h1 class="gallery-title display">Curation</h1>
    <span class="gallery-count" id="who"></span>
  </div>

  <div class="cur-stats" id="stats"></div>

  <div class="cur-toolbar">
    <div class="seg" id="seg">
      <button data-f="all" class="active" type="button">All</button>
      <button data-f="pending" type="button">Pending</button>
      <button data-f="approved" type="button">Approved</button>
      <button data-f="featured" type="button">Featured</button>
    </div>
    <select id="sort" class="cur-input" aria-label="Sort order">
      <option value="new">Newest first</option>
      <option value="old">Oldest first</option>
    </select>
    <input id="search" class="cur-input" type="search" placeholder="Search guest" aria-label="Search guest name" />
    <button id="reviewBtn" class="cur-review-btn" type="button">Review pending</button>
  </div>

  <div class="cur-grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    No photos match. They appear here as guests share them from the capture page.
  </div>
</div>

<div class="review" id="review">
  <button class="lb-close" id="reviewClose" aria-label="Close review">&times;</button>
  <div class="review-inner">
    <div class="review-photo" id="reviewPhoto" role="img" aria-label="Photo under review"></div>
    <div class="review-meta" id="reviewMeta"></div>
    <div class="review-progress" id="reviewProgress"></div>
    <div class="review-actions">
      <button id="rSkip" class="btn ghost" type="button">Skip</button>
      <button id="rFeature" class="btn" type="button">Feature</button>
      <button id="rApprove" class="btn primary" type="button">Approve</button>
    </div>
    <button id="rRemove" class="review-remove" type="button">Remove this photo</button>
  </div>
</div>

<script src="/curate.js"></script>
</body>
</html>
