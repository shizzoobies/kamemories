<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a1626" />
<title>The gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="topbar">
  <a class="brand" id="brand" href="/">Event</a>
  <nav>
    <a href="/">Home</a>
    <a class="pill" href="/add">Add photos</a>
  </nav>
</header>

<div class="gallery-head">
  <h1 class="gallery-title display">The gallery</h1>
  <div class="gallery-head-right">
    <div class="gallery-sort" id="gallerySort" role="group" aria-label="Sort photos">
      <button type="button" data-sort="recent" class="on">Latest</button>
      <button type="button" data-sort="top">Most loved</button>
    </div>
    <span class="gallery-count" id="albumCount"></span>
  </div>
</div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">
  No photos here yet. They appear as guests share them and the host approves their favorites.
  In the meantime, <a href="/add">add yours</a>.
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
  <div id="lbContent"></div>
  <div class="lb-caption" id="lbCaption"></div>
  <div class="lb-meta" id="lbMeta"></div>
  <div class="lb-actions">
    <button id="lbLike" class="lb-like" type="button" aria-label="Love this photo" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.3s-6.9-4.2-9.3-8.5C1.3 9.1 2.6 6 5.5 5.5c1.9-.3 3.5.6 4.6 2 .5.6.9 1.3 1.9 1.3s1.4-.7 1.9-1.3c1.1-1.4 2.7-2.3 4.6-2 2.9.5 4.2 3.6 2.8 6.3-2.4 4.3-9.3 8.5-9.3 8.5z"/></svg>
      <span class="like-n">0</span>
    </button>
    <a id="lbDownload" class="btn" download>Download</a>
  </div>
</div>

<footer class="cine-foot">
  <a href="https://kamemories.com/" aria-label="kamemories home"><img class="cine-foot-logo" src="/logo.png" alt="KA Memories" width="605" height="361" /></a>
  <p class="cine-foot-copy">&copy; 2026 KA Memories. All rights reserved.</p>
</footer>

<script src="/gallery.js"></script>
<script src="/demo-theme.js"></script>
</body>
</html>
