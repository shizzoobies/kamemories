<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a1626" />
<title>The gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="topbar">
  <a class="brand brand-logo" href="/" aria-label="KA Memories"><img src="/logo.png" alt="KA Memories" width="1200" height="747" /></a>
  <nav>
    <a href="/">Home</a>
    <a class="pill" href="/add">Add photos</a>
  </nav>
</header>

<div class="gallery-head">
  <h1 class="gallery-title display">The gallery</h1>
  <span class="gallery-count" id="albumCount"></span>
</div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">
  No photos here yet. They appear as guests share them and the host approves their favorites.
  In the meantime, <a href="/add">add yours</a>.
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
  <div id="lbContent"></div>
  <div class="lb-caption" id="lbCaption"></div>
  <div class="lb-meta" id="lbMeta"></div>
  <div class="lb-actions">
    <a id="lbDownload" class="btn" download>Download</a>
  </div>
</div>

<footer class="cine-foot">
  <a href="https://kamemories.com/" aria-label="kamemories home"><img class="cine-foot-logo" src="/logo.png" alt="KA Memories" width="1200" height="747" /></a>
  <p class="cine-foot-copy">&copy; 2026 KA Memories. All rights reserved.</p>
</footer>

<script src="/gallery.js"></script>
<script src="/demo-theme.js"></script>
</body>
</html>
