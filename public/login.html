<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070d18" />
<title>Sign in . kamemories</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body class="cine">

<div class="bg-stage" id="bgStage" aria-hidden="true">
  <video class="bg-video" id="bgA" muted playsinline preload="auto"></video>
  <video class="bg-video" id="bgB" muted playsinline preload="none"></video>
</div>
<div class="veil" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="cine-nav">
  <a class="cine-brand" href="/">kamemories</a>
  <nav class="cine-links">
    <a class="cine-signin" href="/">Home</a>
  </nav>
</header>

<div class="cine-auth-wrap">
  <div class="cine-auth reveal" style="--d:1">
    <p class="cine-eyebrow">Welcome</p>
    <h1>Sign in.</h1>
    <p class="cine-sub">Enter your email and we will send a one-time sign-in link. No password to remember.</p>

    <form id="form">
      <input id="email" class="cine-field" type="email" placeholder="you@example.com" autocomplete="email" required />
      <button id="submit" class="cine-btn" type="submit">Email me a link</button>
    </form>

    <p id="msg" class="cine-note"></p>

    <div id="sent" class="cine-sent" style="display:none">
      <p class="cine-sub">Check your inbox. We sent a sign-in link to <strong id="sentTo"></strong>. It expires in 15 minutes and works once.</p>
    </div>

    <div id="dev" class="cine-dev" style="display:none">
      <p class="cine-note">Dev mode: no email provider is configured, so here is your link.</p>
      <a id="devLink" href="#"></a>
    </div>
  </div>
</div>

<script src="/home.js"></script>
<script src="/login.js"></script>
</body>
</html>
