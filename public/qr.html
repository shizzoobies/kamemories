<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Make your QR card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/styles.css" />
<style>
  .controls-block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 22px; }
  .controls-block label { display:block; font-size: 0.84rem; color: var(--muted); margin-bottom: 6px; }
  .controls-block input { width:100%; padding:13px 15px; border-radius:10px; border:1px solid var(--line); background: var(--surface-2); color: var(--ink); font: inherit; margin-bottom: 14px; }

  /* Printable card */
  .card {
    background: #f7f2e8;
    color: #2a241d;
    border-radius: 10px;
    padding: 40px 32px 44px;
    text-align: center;
    max-width: 420px;
    margin: 0 auto;
    box-shadow: var(--shadow);
  }
  .card .eyebrow { letter-spacing: 0.3em; text-transform: uppercase; font-size: 0.72rem; color: #9a7a3e; margin: 0 0 14px; }
  .card .names { font-family: "Playfair Display", serif; font-size: 2.1rem; margin: 0 0 6px; font-weight: 500; }
  .card .qr { width: 220px; height: 220px; margin: 22px auto; background:#fff; padding: 12px; border-radius: 6px; display:flex; align-items:center; justify-content:center; }
  .card .qr img, .card .qr canvas { width: 100% !important; height: 100% !important; }
  .card .how { font-size: 1rem; line-height: 1.5; margin: 6px 0 0; }
  .card .url { font-family: "Hanken Grotesk", sans-serif; font-size: 0.82rem; color: #7a6a52; margin-top: 14px; word-break: break-all; }

  @media print {
    body { background: #fff !important; }
    .wrap > *:not(#cardArea) { display: none !important; }
    #cardArea { margin: 0; }
    .card { box-shadow: none; border: 1px solid #ddd; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="event-head" style="padding-bottom:6px">
    <p class="event-eyebrow">For the couple</p>
    <h1 class="event-name display" style="font-size:2.2rem">Your QR card</h1>
    <p class="event-sub">Print this and set it on the tables. Guests scan it to post photos straight to your album.</p>
  </header>

  <div class="controls-block">
    <label for="urlField">Guest link (this is what the QR points to)</label>
    <input id="urlField" type="url" />
    <label for="namesField">Names on the card</label>
    <input id="namesField" type="text" placeholder="Kristina & Alex" />
    <div class="row">
      <button id="makeBtn" class="btn primary" type="button">Update card</button>
      <button id="printBtn" class="btn" type="button">Print</button>
    </div>
  </div>

  <div id="cardArea">
    <div class="card">
      <p class="eyebrow">Help us remember tonight</p>
      <h2 class="names" id="cardNames">Kristina &amp; Alex</h2>
      <p class="how">Scan to share your photos</p>
      <div class="qr" id="qr"></div>
      <p class="how">Point your camera here, then post up to <span id="cardLimit">10</span> a day.</p>
      <p class="url" id="cardUrl"></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
  const urlField = document.getElementById("urlField");
  const namesField = document.getElementById("namesField");
  const qrBox = document.getElementById("qr");

  urlField.value = "https://pics.tandcknot.com/";

  function draw() {
    const url = urlField.value.trim() || (location.origin + "/");
    const names = namesField.value.trim();
    document.getElementById("cardNames").textContent = names || "Our Wedding";
    document.getElementById("cardUrl").textContent = url.replace(/^https?:\/\//, "");
    qrBox.innerHTML = "";
    if (window.QRCode) {
      new QRCode(qrBox, { text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
    } else {
      qrBox.textContent = "QR library failed to load. Check your connection.";
    }
  }

  document.getElementById("makeBtn").addEventListener("click", draw);
  document.getElementById("printBtn").addEventListener("click", () => window.print());
  window.addEventListener("load", draw);

  // Pull the live event name and daily limit so the printed card matches the deployed settings.
  fetch("/api/quota").then((r) => r.json()).then((q) => {
    if (q && q.limit) document.getElementById("cardLimit").textContent = q.limit;
    if (q && q.event && !namesField.value) namesField.value = q.event;
    draw();
  }).catch(() => {});
</script>
</body>
</html>
